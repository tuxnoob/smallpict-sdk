[package]
name = "smallpict"
version = "1.0.0"
edition = "2021"
rust-version = "1.75.0"
description = "Official Rust SDK for SmallPict Image Optimization API — next-gen compression (AVIF, WebP), Edge CDN delivery, and cache purging."
license = "MIT"
repository = "https://github.com/tuxnoob/smallpict-rust"
homepage = "https://smallpict.tuxnoob.com"
documentation = "https://docs.rs/smallpict"
readme = "README.md"
keywords = ["smallpict", "image-optimization", "webp", "avif", "compression"]
categories = ["web-programming::http-client", "multimedia::images", "api-bindings"]

[features]
default = ["async", "rustls-tls"]
async = ["tokio", "reqwest/rustls-tls"]
blocking = ["reqwest/blocking", "reqwest/rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/default-tls"]

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "stream"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time", "fs"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
bytes = "1.0"
hex = "0.4"
hmac = "0.12"
sha2 = "0.11"
uuid = { version = "1.0", features = ["v4"] }
regex = "1.10"
rand = "0.8"
urlencoding = "2.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
