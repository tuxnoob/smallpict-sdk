[package]
name = "smallpict"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Official asynchronous Rust SDK for SmallPict Image Optimization API"
license = "MIT"
repository = "https://github.com/tuxnoob/smallpict-rust"
homepage = "https://smallpict.tuxnoob.com"
documentation = "https://docs.rs/smallpict"
readme = "README.md"
keywords = ["smallpict", "image-optimization", "webp", "avif", "compression"]
categories = ["web-programming::http-client", "multimedia::images"]

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "stream"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
bytes = "1.0"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"

[features]
default = ["default-tls"]
default-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls-tls"]

[dev-dependencies]
wiremock = "0.5"
tokio-test = "0.4"
