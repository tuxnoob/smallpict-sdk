name: Publish github.com/tuxnoob/smallpict-go to pkg.go.dev

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  tag-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test -race -v ./...
      - name: Request indexing on pkg.go.dev
        run: |
          VERSION="${{ github.event.release.tag_name || 'latest' }}"
          curl -s "https://proxy.golang.org/github.com/tuxnoob/smallpict-go/@v/${VERSION}.info" || true
