version: 2
updates:
  # 1. GitHub Actions Workflows (Root)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5

  # 2. Node.js SDK (npm)
  - package-ecosystem: "npm"
    directory: "/smallpict-node"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-node)"
    open-pull-requests-limit: 5

  # 3. Python SDK (pip / hatch)
  - package-ecosystem: "pip"
    directory: "/smallpict-python"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-python)"
    open-pull-requests-limit: 5

  # 4. PHP SDK (composer)
  - package-ecosystem: "composer"
    directory: "/smallpict-php"
