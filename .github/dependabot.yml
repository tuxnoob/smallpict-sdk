      interval: "weekly"
    commit-message:
      prefix: "chore(deps-rust)"
    open-pull-requests-limit: 5

  # 7. Ruby SDK (bundler)
  - package-ecosystem: "bundler"
    directory: "/smallpict-ruby"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-ruby)"
    open-pull-requests-limit: 5

  # 8. Java SDK (maven)
  - package-ecosystem: "maven"
    directory: "/smallpict-java"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-java)"
    open-pull-requests-limit: 5
