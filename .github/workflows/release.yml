name: SmallPict SDK Central Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sdk:
        description: 'Specific SDK to publish (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - node
          - python
          - php
          - go
          - rust
          - ruby
          - java

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 🔍 Pre-Release Contract Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Cross-SDK Contract Audit
        run: ./scripts/check-sdk-contract.sh

  publish-node:
    name: 📦 Publish Node.js SDK (@smallpict/sdk -> npm)
    needs: verify
    environment: release
    if: ${{ github.event_name == 'push' || inputs.sdk == 'all' || inputs.sdk == 'node' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: smallpict-node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-python:
    name: 📦 Publish Python SDK (smallpict -> PyPI)
    needs: verify
    environment: release
    if: ${{ github.event_name == 'push' || inputs.sdk == 'all' || inputs.sdk == 'python' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: smallpict-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install hatch
      - run: hatch build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: smallpict-python/dist/

  publish-php:
    name: 📦 Notify Packagist (smallpict/smallpict-php)
    needs: verify
    environment: release
    if: ${{ github.event_name == 'push' || inputs.sdk == 'all' || inputs.sdk == 'php' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Packagist Webhook
        run: |
          curl -s -XPOST \
            -H'Content-Type:application/json' \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -d'{"repository":{"url":"https://github.com/tuxnoob/smallpict-sdk"}}'

  publish-go:
    name: 📦 Index Go SDK (pkg.go.dev)
    needs: verify
    environment: release
    if: ${{ github.event_name == 'push' || inputs.sdk == 'all' || inputs.sdk == 'go' }}
    runs-on: ubuntu-latest
    steps:
      - name: Request indexing on pkg.go.dev
        run: |
          VERSION="${{ github.ref_name }}"
          curl -s "https://proxy.golang.org/github.com/tuxnoob/smallpict-go/@v/${VERSION}.info" || true

  publish-rust:
    name: 📦 Publish Rust SDK (smallpict -> crates.io)
    needs: verify
    environment: release
    if: ${{ github.event_name == 'push' || inputs.sdk == 'all' || inputs.sdk == 'rust' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smallpict-rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-ruby:
    name: 📦 Publish Ruby SDK (smallpict -> RubyGems)
    needs: verify
    environment: release
    if: ${{ github.event_name == 'push' || inputs.sdk == 'all' || inputs.sdk == 'ruby' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smallpict-ruby
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: |
          mkdir -p ~/.gem
          echo "---" > ~/.gem/credentials
          echo ":rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}" >> ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem build smallpict.gemspec
          gem push smallpict-*.gem

  publish-java:
    name: 📦 Publish Java SDK (com.smallpict:smallpict-java -> Maven Central)
    needs: verify
    environment: release
    if: ${{ github.event_name == 'push' || inputs.sdk == 'all' || inputs.sdk == 'java' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smallpict-java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          server-id: 'ossrh'
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: mvn clean deploy -P release -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
