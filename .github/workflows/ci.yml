name: SmallPict SDK Central CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-audit:
    name: 🔍 OpenAPI & Contract Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Contract Standards
        run: ./scripts/check-sdk-contract.sh

  test-node:
    name: Node.js SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smallpict-node
    strategy:
      matrix:
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - run: npm run build

  test-python:
    name: Python SDK (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smallpict-python
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          pip install --upgrade pip
          pip install -e ".[dev,pil]"
      - run: pytest

  test-php:
    name: PHP SDK (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smallpict-php
    strategy:
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, openssl, mbstring
          tools: composer:v2
      - name: Install dependencies
        run: composer update --prefer-dist --no-progress
      - name: Run test suite
        run: vendor/bin/phpunit

  test-go:
    name: Go SDK (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smallpict-go
    strategy:
      matrix:
        go: ["1.21", "1.22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test -v -race -cover ./...

  test-rust:
    name: Rust SDK (${{ matrix.rust }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smallpict-rust
    strategy:
      matrix:
        rust: ["stable", "1.80.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - run: cargo test --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test-ruby:
    name: Ruby SDK (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smallpict-ruby
    strategy:
      matrix:
        ruby: ["3.0", "3.1", "3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: |
          gem install bundler
          bundle install
          bundle exec rspec

  test-java:
    name: Java SDK (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smallpict-java
    strategy:
      matrix:
        java: ["17", "21", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - run: mvn clean test
