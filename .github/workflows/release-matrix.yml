name: Multi-Registry Release Matrix

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify SDK Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Cross-SDK Contract Audit
        run: ./scripts/check-sdk-contract.sh

  publish-node:
    name: Publish to npm (@smallpict/sdk)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: smallpict-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-python:
    name: Publish to PyPI (smallpict)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: smallpict-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install hatch
      - run: hatch build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: smallpict-python/dist/

  publish-rust:
    name: Publish to crates.io (smallpict)
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smallpict-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-ruby:
    name: Publish to RubyGems (smallpict)
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smallpict-ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: |
          mkdir -p ~/.gem
          echo "---" > ~/.gem/credentials
          echo ":rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}" >> ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem build smallpict.gemspec
          gem push smallpict-*.gem
