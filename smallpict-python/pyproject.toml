[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smallpict"
version = "1.0.0"
description = "Official Python SDK for SmallPict Image Optimization API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "SmallPict Engineering", email = "support@tuxnoob.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
pil = [
    "Pillow>=9.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://smallpict.tuxnoob.com"
Repository = "https://github.com/tuxnoob/smallpict-python"
Documentation = "https://smallpict.tuxnoob.com/docs/sdks/python"
Changelog = "https://github.com/tuxnoob/smallpict-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["smallpict"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.mypy]
python_version = "3.8"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
